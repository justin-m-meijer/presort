<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181926" />
      <stop offset="100%" stop-color="#0b0c10" />
    </linearGradient>

    <!-- Border Stroke Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f5b66" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1f232a" stop-opacity="0.2" />
    </linearGradient>

    <!-- Arrow Left Gradient (Cyan/Teal) -->
    <linearGradient id="lane-left" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0052cc" />
      <stop offset="100%" stop-color="#00d2ff" />
    </linearGradient>

    <!-- Arrow Middle Gradient (Indigo/Violet) -->
    <!-- userSpaceOnUse: de middelste pijl is kaarsrecht, dus zijn omhullende
         rechthoek is nul breed en een objectBoundingBox-gradient valt weg -->
    <linearGradient id="lane-mid" gradientUnits="userSpaceOnUse" x1="256" y1="380" x2="256" y2="135">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Arrow Right Gradient (Amber/Orange) -->
    <linearGradient id="lane-right" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Background (Squircle) -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="4" />

  <!-- Road / Flow Base Guideline (Subtle) -->
  <path d="M 256 410 L 256 360" stroke="#2d3342" stroke-width="12" stroke-linecap="round" />

  <!-- Left Sorter Branch -->
  <g filter="url(#glow)">
    <path d="M 236 380 C 236 330, 160 300, 160 210 L 160 170" 
          fill="none" 
          stroke="url(#lane-left)" 
          stroke-width="16" 
          stroke-linecap="round" />
    <path d="M 135 185 L 160 145 L 185 185" 
          fill="none" 
          stroke="url(#lane-left)" 
          stroke-width="16" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>

  <!-- Center Sorter Branch -->
  <g filter="url(#glow)">
    <path d="M 256 380 L 256 160" 
          fill="none" 
          stroke="url(#lane-mid)" 
          stroke-width="16" 
          stroke-linecap="round" />
    <path d="M 231 175 L 256 135 L 281 175" 
          fill="none" 
          stroke="url(#lane-mid)" 
          stroke-width="16" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>

  <!-- Right Sorter Branch -->
  <g filter="url(#glow)">
    <path d="M 276 380 C 276 330, 352 300, 352 210 L 352 170" 
          fill="none" 
          stroke="url(#lane-right)" 
          stroke-width="16" 
          stroke-linecap="round" />
    <path d="M 327 185 L 352 145 L 377 185" 
          fill="none" 
          stroke="url(#lane-right)" 
          stroke-width="16" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>

  <!-- Bottom Inflow Point -->
  <circle cx="256" cy="400" r="10" fill="#ffffff" opacity="0.9" />
</svg>
