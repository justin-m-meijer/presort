<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 168" role="img"
     aria-label="Mail passes a model you run yourself and is split into calendar entries and reminders">
  <title>Mail passes a model you run yourself and is split into calendar entries and reminders</title>
  <style>
    /* A fixed mid-grey rather than currentColor. Loaded as an image -- which is what a
       README does -- there is no surrounding text to inherit a colour from, and black on
       GitHub's dark theme is black on black. This grey reads on both. */
    .ink { color: #6b7280; }
    .rail  { stroke: currentColor; stroke-width: 1; stroke-dasharray: 3 4; opacity: .28; fill: none; }
    .chip  { stroke: currentColor; fill: none; stroke-width: 1.4; opacity: .55; }
    .label { font: 500 9px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
             fill: currentColor; opacity: .55; text-anchor: middle; letter-spacing: .2px; }
    /* One fixed blue, picked to read on white and on near-black alike. */
    .accent { color: #4b7bec; }
    @media (prefers-reduced-motion: reduce) { .letter, .pulse { animation: none; display: none; } }
  </style>

  <g class="ink">
    <!-- the two rails out of the model, and the one into it -->
    <path class="rail" d="M88 84 H232"/>
    <path class="rail" d="M296 79 Q356 79 426 40"/>
    <path class="rail" d="M296 89 Q356 89 426 128"/>

    <!-- inbox -->
    <g transform="translate(62 84)">
      <path class="chip" d="M-11 -3 h5 l2 4 h8 l2 -4 h5 v7 a2 2 0 0 1 -2 2 h-18 a2 2 0 0 1 -2 -2 z"/>
      <path class="chip" d="M-9 -3 l3 -7 h12 l3 7"/>
      <text class="label" y="20">Mail</text>
    </g>

    <!-- your model -->
    <g transform="translate(258 84)">
      <rect x="-30" y="-24" width="60" height="46" rx="8" class="accent"
            fill="currentColor" fill-opacity=".08" stroke="currentColor" stroke-opacity=".22">
        <animate attributeName="fill-opacity" values=".08;.08;.24;.08"
                 keyTimes="0;.55;.8;1" dur="4.8s" begin="0s" repeatCount="indefinite"/>
      </rect>
      <g class="accent" stroke="currentColor" stroke-width="1.4" fill="none">
        <rect x="-7" y="-15" width="14" height="14" rx="2"/>
        <path d="M-3 -18 v3 M3 -18 v3 M-3 -1 v3 M3 -1 v3 M-10 -11 h3 M-10 -5 h3 M7 -11 h3 M7 -5 h3"/>
      </g>
      <text class="label" y="14">Your model</text>
    </g>

    <!-- calendar -->
    <g transform="translate(452 40)">
      <rect x="-10" y="-9" width="20" height="18" rx="3" class="chip"/>
      <path class="chip" d="M-10 -3 h20 M-5 -12 v5 M5 -12 v5"/>
      <text class="label" y="22">Calendar</text>
    </g>

    <!-- reminders -->
    <g transform="translate(452 128)">
      <g class="chip">
        <path d="M-9 -7 l2.5 2.5 L-2 -10"/>
        <path d="M-9 1 l2.5 2.5 L-2 -2"/>
        <path d="M2 -7 h8 M2 1 h8 M-9 9 h19"/>
      </g>
      <text class="label" y="22">Reminders</text>
    </g>

  </g>

  <defs>
    <g id="letter">
      <rect x="-7.5" y="-5" width="15" height="10" rx="1.5"/>
      <path d="M-7.5 -5 l7.5 5.5 l7.5 -5.5" fill="none" stroke="#fff"
            stroke-opacity=".8" stroke-width="1.2" stroke-linejoin="round"/>
    </g>
  </defs>

  <!-- Four letters, each on its own 4.8s round, spaced a quarter apart with a negative
       start time. That last bit does two things at once: something is always in flight,
       and at time zero, which is what an image tag shows because it freezes the animation,
       every letter is already somewhere along its way instead of piled up at the start.

       The previous version squeezed all four into one 9.6s round using keyPoints, which
       left the outgoing letters standing still and visible beside the model for half of
       every round. -->
  <g class="accent" fill="currentColor">
    <g class="letter">
      <use href="#letter" x="88" y="84"/>
      <animateMotion dur="4.8s" begin="0s" repeatCount="indefinite" path="m0,0 h144"/>
      <animate attributeName="opacity" dur="4.8s" begin="0s" repeatCount="indefinite"
               values="0;1;1;0" keyTimes="0;.12;.82;1"/>
    </g>
    <g class="letter">
      <use href="#letter" x="88" y="84"/>
      <animateMotion dur="4.8s" begin="-2.4s" repeatCount="indefinite" path="m0,0 h144"/>
      <animate attributeName="opacity" dur="4.8s" begin="-2.4s" repeatCount="indefinite"
               values="0;1;1;0" keyTimes="0;.12;.82;1"/>
    </g>
    <g class="letter">
      <use href="#letter" x="296" y="79"/>
      <animateMotion dur="4.8s" begin="-1.2s" repeatCount="indefinite"
                     path="m0,0 q60,0 130,-39"/>
      <animate attributeName="opacity" dur="4.8s" begin="-1.2s" repeatCount="indefinite"
               values="0;1;1;0" keyTimes="0;.12;.82;1"/>
    </g>
    <g class="letter">
      <use href="#letter" x="296" y="89"/>
      <animateMotion dur="4.8s" begin="-3.6s" repeatCount="indefinite"
                     path="m0,0 q60,0 130,39"/>
      <animate attributeName="opacity" dur="4.8s" begin="-3.6s" repeatCount="indefinite"
               values="0;1;1;0" keyTimes="0;.12;.82;1"/>
    </g>
  </g>
</svg>
