<!doctype html><meta charset="utf-8">
<style>
 body{margin:0;font:14px -apple-system,sans-serif}
 .band{padding:20px}
 .light{background:#fff;color:#2b2b2b}
 .dark{background:#141414;color:#e8e8e8}
 .sepia{background:#f6f1e7;color:#4a4034}
 svg{width:100%;max-width:560px;height:auto;display:block}
</style>
<div class="band light"><b>lichte pagina</b><div id="a"></div></div>
<div class="band dark"><b>donkere pagina</b><div id="b"></div></div>
<div class="band sepia"><b>warme pagina</b><div id="c"></div></div>
<script>
fetch('flow.svg').then(r=>r.text()).then(t=>{for(const id of ['a','b','c'])document.getElementById(id).innerHTML=t;});
</script>
